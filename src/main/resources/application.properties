spring.application.name=Tarea_01

#ConfiguraciÃ³n de MySQL. Si fuera MariaDB serÃ­a jdbc:mariadb://localhost:3306/tienda
spring.datasource.url=jdbc:mysql://localhost:3306/reserva-aulas?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#ConfiguraciÃ³n de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#Para ver las SQL que se ejecutan poner las siguientes (opcional)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Sirve la interfaz estática desde la carpeta frontend del proyecto.
spring.web.resources.static-locations=classpath:/static/,file:./frontend/
